<title>LAST BASTION Wiki</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Layout: the game's menu shell - slanted page buttons on the left, one neon-framed panel, cards in rarity frames, item card on click */
:root {
  --bg: #050b12; --navy: #0a1823; --panel: #0c1f30; --panel2: #10283d; --steel: #223444; --line: #1c4664;
  --cyan: #14dbfc; --pale: #9fd7fa; --yellow: #ffd60a; --white: #f5f5f0; --mute: #7f9bb3; --red: #df263c; --orange: #ff7814; --green: #3dd20b;
  --btn: #0d4f86; --btn2: #0a3a64;
  --head: "Oswald", "Arial Narrow", "Impact", sans-serif; --display: "Bangers", "Impact", sans-serif; --mono: "Roboto Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--white); }
body { font-family: var(--head); font-weight: 500; font-size: 17px; line-height: 1.35; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px;
  background: radial-gradient(1200px 600px at 70% -10%, #12345288, transparent 60%), radial-gradient(900px 500px at -10% 110%, #2a124a66, transparent 60%), var(--bg); background-attachment: fixed; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.wrap { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 16px; }
header.top { max-width: 1480px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.logo { font-family: var(--display); font-size: 46px; letter-spacing: 1.5px; color: var(--yellow); line-height: 1; text-shadow: 3px 3px 0 #000, -1px -1px 0 #000; transform: skew(-6deg); white-space: nowrap; }
.logo small { font-family: var(--head); font-weight: 700; font-size: 17px; color: var(--cyan); letter-spacing: 3px; margin-left: 8px; text-shadow: none; }
.search { flex: 1 1 320px; position: relative; min-width: 0; }
.search input { width: 100%; background: #06111b; border: 2px solid var(--cyan); padding: 10px 40px 10px 40px; font-size: 18px; letter-spacing: .5px; text-transform: uppercase; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); box-shadow: inset 0 0 18px #14dbfc22; }
.search input::placeholder { color: #5f8aa6; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: var(--cyan); }
.search .x { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--mute); font-size: 21px; cursor: pointer; padding: 4px 8px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--mono); font-size: 13px; color: var(--pale); }
.counts b { color: var(--yellow); font-weight: 700; }
.counts span { background: #0a1a28; border: 1px solid var(--line); padding: 3px 7px; }

nav.side { display: flex; flex-direction: column; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); align-self: start; }
nav.side .grp { font-size: 14px; color: var(--pale); letter-spacing: 1.5px; margin: 8px 0 0; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
nav.side button { display: flex; align-items: center; gap: 10px; justify-content: space-between; text-align: left; border: 0; cursor: pointer; padding: 9px 12px 9px 14px; font-weight: 700; font-size: 17px; letter-spacing: .6px;
  background: linear-gradient(180deg, var(--btn), var(--btn2)); clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%); border-left: 4px solid #1a6db0; }
nav.side button:hover { filter: brightness(1.25); }
nav.side button[aria-current="true"] { background: linear-gradient(180deg, #ffe14a, #e6b800); color: #111; border-left-color: #fff3a0; }
nav.side button i { font-style: normal; font-family: var(--mono); font-size: 13px; opacity: .8; }

main.panel { position: relative; min-width: 0; background: linear-gradient(180deg, #0d2438f2, #08182af2); border: 2px solid var(--cyan); box-shadow: 0 0 0 1px #000, 0 0 24px #14dbfc33, inset 0 0 40px #0006; padding: 16px 18px 22px; }
main.panel::before, main.panel::after { content: ""; position: absolute; width: 22px; height: 22px; border: 3px solid var(--white); pointer-events: none; }
main.panel::before { top: -6px; left: -6px; border-right: 0; border-bottom: 0; }
main.panel::after { bottom: -6px; right: -6px; border-left: 0; border-top: 0; }
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
.ph h1 { margin: 0; font-weight: 700; font-style: italic; font-size: 34px; color: var(--yellow); letter-spacing: .5px; text-shadow: 2px 2px 0 #000; text-wrap: balance; }
.ph .sub { color: var(--pale); font-size: 16px; letter-spacing: .4px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 14px; padding: 10px; background: #071420; border: 1px solid var(--line); }
.fg { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.fg > label { font-size: 13px; color: var(--mute); letter-spacing: 1.2px; margin-right: 4px; }
.chip { cursor: pointer; border: 1px solid var(--line); background: #0b2133; padding: 4px 9px; font-size: 15px; font-weight: 700; letter-spacing: .4px; display: inline-flex; gap: 5px; align-items: center; color: var(--c, var(--white)); }
.chip:hover { border-color: var(--pale); }
.chip[aria-pressed="true"] { background: var(--c, var(--yellow)); color: #0a0a0a; border-color: transparent; }
.chip[aria-pressed="true"] svg { fill: #0a0a0a; }
select { background: #0b2133; border: 1px solid var(--line); padding: 5px 8px; font-weight: 700; font-size: 15px; letter-spacing: .4px; }
.shown { margin-left: auto; font-family: var(--mono); font-size: 14px; color: var(--mute); }
.shown b { color: var(--cyan); }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.grid.sm { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.sec { margin: 18px 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sec h2 { margin: 0; font-style: italic; font-weight: 700; font-size: 24px; color: var(--white); letter-spacing: .5px; }
.sec .sub { color: var(--pale); font-size: 15px; min-width: 0; }
.sec:first-child { margin-top: 0; }

/* chamfered frame card, the border is the outer background */
.card { --c: var(--cyan); position: relative; background: var(--c); padding: 2px; cursor: pointer; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); transition: transform .12s, filter .12s; text-align: left; border: 0; display: block; width: 100%; color: inherit; }
.card:hover { transform: translateY(-2px); filter: brightness(1.15); }
.card > .in { background: linear-gradient(170deg, color-mix(in srgb, var(--c) 20%, #0b1d2c) 0%, #0a1824 45%, #08131d 100%); clip-path: inherit; height: 100%; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card.locked { filter: saturate(.25) brightness(.8); }
.card.locked:hover { filter: saturate(.5) brightness(.95); }
.nm { font-weight: 700; font-size: 20px; line-height: 1.1; letter-spacing: .3px; text-transform: uppercase; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 14px; color: var(--pale); letter-spacing: .4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; letter-spacing: .6px; padding: 1px 6px; background: #000a; border: 1px solid var(--c, var(--line)); color: var(--c, var(--pale)); text-transform: uppercase; }
.tag.solid { background: var(--c); color: #0a0a0a; border-color: transparent; }
.maker { font-family: var(--mono); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
.score { font-weight: 700; font-style: italic; font-size: 28px; line-height: 1; text-shadow: 2px 2px 0 #000; }
.score small { font-size: 12px; font-style: normal; color: var(--mute); letter-spacing: 1px; margin-left: 4px; }
.row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: auto; }
.pic { position: relative; width: 100%; background-repeat: no-repeat; image-rendering: auto; }
.pic.empty { display: grid; place-items: center; color: #3c5a72; font-family: var(--mono); font-size: 13px; letter-spacing: 1px; background: repeating-linear-gradient(135deg, #0c2031 0 8px, #0a1b29 8px 16px); }
.corner { position: absolute; top: 6px; right: 8px; z-index: 1; }
.stamp { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; pointer-events: none; }
.stamp span { background: #000c; border: 2px solid var(--red); color: var(--red); font-weight: 700; letter-spacing: 1.5px; padding: 4px 10px; transform: rotate(-8deg); font-size: 16px; }
.ico { width: 14px; height: 14px; fill: currentColor; flex: none; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; font-family: var(--mono); font-size: 13px; color: var(--mute); }
.mini .gi { width: 13px; height: 13px; margin-right: 2px; vertical-align: -2px; }
.mini b { display: block; color: var(--white); font-size: 15px; }
.flav { color: #ff5a6e; font-style: italic; font-size: 15px; }
.efx { font-size: 15px; color: #d9e8f2; line-height: 1.3; }

/* detail sheet: the in-game item card */
.ov { position: fixed; inset: 0; z-index: 30; background: #000b; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 24px) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.sheet { --c: var(--cyan); width: min(760px, 100%); background: #0a1a28; border: 2px solid var(--c); box-shadow: 0 0 40px color-mix(in srgb, var(--c) 40%, transparent); position: relative; }
.sheet .hd { background: linear-gradient(100deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); color: #0a0a0a; padding: 10px 52px 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.sheet .hd .score { color: #fff; font-size: 39px; }
.sheet .hd .lbl { font-weight: 700; letter-spacing: 1px; font-size: 15px; }
.sheet .hd .r { margin-left: auto; font-weight: 700; font-style: italic; font-size: 18px; letter-spacing: .5px; }
.sheet .close { position: absolute; top: 6px; right: 6px; z-index: 2; width: 38px; height: 38px; border: 0; background: var(--red); color: #fff; font-weight: 700; font-size: 21px; cursor: pointer; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
.sheet .bd { padding: 14px 16px 18px; display: grid; gap: 14px; }
.sheet h3 { margin: 0; font-style: italic; font-size: 30px; line-height: 1.05; color: var(--c); text-shadow: 2px 2px 0 #000; overflow-wrap: anywhere; }
.sheet h4 { margin: 0 0 6px; font-size: 15px; letter-spacing: 1.5px; color: var(--cyan); font-weight: 700; }
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.stats { display: grid; gap: 3px; }
.st { display: grid; grid-template-columns: 116px minmax(0, 1fr) 70px; gap: 8px; align-items: center; background: #0e2436; padding: 4px 8px; font-size: 15px; }
.st .k { color: var(--pale); letter-spacing: .6px; font-size: 14px; }
.st .v { font-family: var(--mono); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; }
.st .b { height: 6px; background: #05101a; position: relative; overflow: hidden; }
.st .b i { position: absolute; inset: 0 auto 0 0; background: var(--c); }
.box { background: #0e2436; border-left: 3px solid var(--c); padding: 8px 10px; display: grid; gap: 4px; }
.list { display: flex; flex-wrap: wrap; gap: 4px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: auto; min-width: min(100%, 560px); font-size: 15px; font-variant-numeric: tabular-nums; }
th.num { text-align: right; }
th { text-align: left; font-size: 13px; letter-spacing: 1px; color: var(--cyan); font-weight: 700; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 5px 14px 5px 8px; border-bottom: 1px solid #13314a; white-space: nowrap; }
td.num { font-family: var(--mono); text-align: right; }
tr.hl td { background: #14dbfc14; }
.res { display: inline-flex; gap: 3px; align-items: center; font-family: var(--mono); font-size: 14px; margin-right: 8px; white-space: nowrap; }
.res .gi { width: 18px; height: 18px; }
.gi { display: inline-block; flex: none; width: 16px; height: 16px; background-repeat: no-repeat; vertical-align: middle; }
.tag .gi { width: 16px; height: 16px; margin: -2px 0; }
/* the game's 9 x 9 pixel icons (Map.pix), drawn as SVG; a disc is the field marker look: dark disc, ring and icon in one colour */
.px { display: inline-block; flex: none; vertical-align: middle; shape-rendering: crispEdges; }
.disc { --c: var(--yellow); display: inline-grid; place-items: center; flex: none; border-radius: 50%; background: #06121c; box-shadow: 0 0 0 2px var(--c), 0 0 12px color-mix(in srgb, var(--c) 45%, transparent); }
.ehead { display: flex; gap: 12px; align-items: center; }
.ehead .nm { font-size: 23px; }
.lines { display: grid; gap: 2px; font-size: 15px; }
.frows { display: grid; gap: 5px; font-size: 15px; color: #d9e8f2; line-height: 1.25; }
.frows > div { display: flex; gap: 8px; align-items: baseline; }
.frows i { font-style: normal; font-size: 11px; letter-spacing: 1px; color: var(--mute); min-width: 44px; flex: none; }
.frows b { font-weight: 700; }
.lines .p { color: var(--green); } .lines .m { color: var(--red); } .lines .n { color: #d9e8f2; }
.kv { display: flex; flex-wrap: wrap; gap: 4px; }
.kv span { font-family: var(--mono); font-size: 13px; background: #000a; border: 1px solid #1d4a6a; padding: 1px 6px; color: var(--pale); }
.kv span b { color: var(--white); }
/* a mock of the plate the game floats over an elite or a boss */
.bb { display: grid; justify-items: center; gap: 3px; padding: 10px 6px 6px; background: radial-gradient(ellipse at 50% 100%, #3a2a2a 0%, #0a1824 70%); min-height: 92px; align-content: end; }
.bb .pl { font-weight: 700; font-size: 16px; letter-spacing: .4px; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; display: flex; gap: 4px; align-items: center; }
.bb .hb { height: 8px; background: #200; outline: 1px solid #000; } .bb .hb i { display: block; height: 100%; background: #ff3b3b; }
.bb .sb { height: 4px; background: #001; } .bb .sb i { display: block; height: 100%; background: #7fe7ff; }
.bb .who { width: 120px; } .bb .who .pic { background-color: transparent; filter: drop-shadow(0 0 1.5px var(--o)) drop-shadow(0 0 1.5px var(--o)) drop-shadow(0 0 6px color-mix(in srgb, var(--o) 50%, transparent)); }
.shotgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.shotgrid figure { margin: 0; background: #000; } .shotgrid img { width: 100%; display: block; aspect-ratio: 16 / 7; object-fit: cover; }
.shotgrid figcaption { font-size: 13px; letter-spacing: .6px; color: var(--pale); padding: 4px 6px; }
#nav button .navi { display: inline-flex; width: 18px; justify-content: center; margin-right: 6px; vertical-align: -3px; }
.st .k { display: flex; gap: 5px; align-items: center; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
.shots figure { margin: 0; background: #000; position: relative; }
.shots img { display: block; width: 100%; aspect-ratio: 480 / 333; object-fit: cover; }
.shots figcaption { position: absolute; left: 0; bottom: 0; right: 0; background: linear-gradient(transparent, #000d); font-size: 14px; font-weight: 700; padding: 10px 6px 4px; letter-spacing: .5px; }
.slider { display: flex; gap: 3px; flex-wrap: wrap; }
.slider button { width: 34px; height: 30px; border: 1px solid var(--line); background: #0b2133; font-weight: 700; cursor: pointer; font-family: var(--mono); }
.slider button[aria-pressed="true"] { background: var(--cyan); color: #000; border-color: var(--cyan); }
.ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.ladder .card > .in { padding: 4px; }
.prow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; font-size: 15px; padding: 3px 0; border-bottom: 1px solid #13314a; }
.prow > b { color: var(--white); }
.prow > span { color: var(--pale); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 15px; }
.kv span:nth-child(odd) { color: var(--pale); }
.mtx td.num { font-weight: 700; }
.empty-msg { padding: 30px; text-align: center; color: var(--mute); }
.tier-n { font-family: var(--display); font-size: 30px; color: var(--cyan); line-height: 1; min-width: 34px; display: inline-block; }
.hint { font-size: 14px; color: var(--mute); }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; flex-direction: row; overflow-x: auto; background: var(--bg); padding: 6px 0; gap: 4px; margin-inline: -4px; }
  nav.side .grp { display: none; }
  nav.side button { flex: none; padding: 8px 14px 8px 10px; font-size: 16px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .logo { font-size: 37px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.wide { grid-template-columns: minmax(0, 1fr); }
  main.panel { padding: 12px 10px 16px; }
  .ph h1 { font-size: 28px; }
  .st { grid-template-columns: 80px minmax(0, 1fr) 62px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
</style>

<header class="top">

<script>
(() => {
const W = window.WIKI;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n, d) => {
  if (n == null || n === "inf") return n === "inf" ? "&infin;" : "-";
  const a = Math.abs(n);
  const u = [[1e15, "Q"], [1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]].find(x => a >= x[0]);
  if (u) { const v = n / u[0]; return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + u[1]; }
  if (d != null) return (+n).toFixed(d);
  return a >= 100 ? Math.round(n).toString() : a >= 10 ? (+n).toFixed(1).replace(/\.0$/, "") : (+n).toFixed(2).replace(/\.?0+$/, "");
};
const pct = n => Math.round(n * 100) + "%";
const RAR = W.rarity, EL = W.elements;
const elColor = e => (EL[e || "none"] || EL.none).color;
const elName = e => e && e !== "none" ? EL[e].name : "KINETIC";
const icon = id => `<svg class="ico"><use href="#i-${id}"/></svg>`;
const resColor = Object.fromEntries(W.resources.map(r => [r.id, r.color]));
const resName = Object.fromEntries(W.resources.map(r => [r.id, r.name]));
// an icon of the game's own icon sheet (res_<id>, el_<id>)
const gi = key => { const S = W.sheets.icon, i = S.map[key]; return i == null ? "" : `<span class="gi" style="background-image:url(img/${S.file}.webp);background-size:${S.cols * 100}% 100%;background-position:${i / (S.cols - 1) * 100}% 0"></span>`; };
const cost = c => !c ? "-" : Object.keys(c).length === 0 ? '<span class="res">FREE</span>' : ["scrap", "bio", "energy", "cores"].filter(k => c[k]).map(k => `<span class="res" style="--rc:${resColor[k]}" title="${resName[k]}">${gi("res_" + k)}${fmt(c[k])}</span>`).join("");
const BODY = { flesh: "FLESH", armor: "ARMOR", shield: "SHIELD" };
const bodyTag = b => `<span class="tag" style="--c:${b === "armor" ? "#ffb35a" : b === "shield" ? "#7fc8ff" : "#ff8a8a"}">${gi("body_" + b) || icon(b)}${BODY[b] || b}</span>`;
// one of the game's 9 x 9 pixel icons (PIX in Client/Map.luau) as an SVG, and the field marker's disc round it
const pix = (key, color = "currentColor", size = 18) => {
  const rows = W.pix[key];
  if (!rows) return "";
  let r = "";
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === "#") r += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`; }));
  return `<svg class="px" viewBox="0 0 9 9" width="${size}" height="${size}" fill="${color}" aria-hidden="true">${r}</svg>`;
};
const disc = (key, color, size = 40) => `<span class="disc" style="--c:${color};width:${size}px;height:${size}px">${pix(key, color, Math.round(size * .55))}</span>`;
// a combo mark's chip as the game draws it over an alien: dark round chip, ring and icon in the mark's colour, stack bars under it
const mchip = (id, color, size = 40, ticks = 0) => `<span style="display:inline-grid;justify-items:center;gap:2px;flex:none"><span class="disc" style="--c:${color};width:${size}px;height:${size}px;background:color-mix(in srgb, ${color} 16%, #000);overflow:hidden">
  ${gi("mk_" + id).replace('class="gi" style="', `class="gi" style="width:${Math.round(size * 1.15)}px;height:${Math.round(size * 1.15)}px;`)}</span>${ticks ? `<b style="color:${color};font-family:var(--mono);letter-spacing:1px;line-height:1">${"|".repeat(ticks)}</b>` : ""}</span>`;
// the game's icon for a stat row
const STAT_ICON = { "DAMAGE": "stat_dmg", "FIRE RATE": "stat_rate", "MAGAZINE": "stat_mag", "RELOAD": "stat_reload", "CRITICAL": "stat_crit", "ACCURACY": "stat_acc",
  "RANGE": "stat_range", "DPS": "stat_dps", "HEALTH": "stat_hp", "SPEED": "stat_time", "SCORE": "stat_score" };
const lines = t => `<div class="lines">${String(t || "").split("\n").filter(Boolean).map(l => `<span class="${l[0] === "+" ? "p" : l[0] === "-" ? "m" : "n"}">${esc(l)}</span>`).join("")}</div>`;
const secs = s => s >= 3600 ? (s / 3600) + " H" : s >= 60 ? (s / 60) + " MIN" : s + " S";
const elTag = (e, solid) => `<span class="tag${solid ? " solid" : ""}" style="--c:${elColor(e)}">${gi("el_" + (e || "none"))}${elName(e)}</span>`;
const human = t => t.replace(/_/g, " ").toUpperCase();
const brands = W.brands;
const typeOrder = ["pistol", "rifle", "shotgun", "sniper", "launcher", "laser"];

// sprite from a picture sheet: percentage positions keep it responsive
function sprite(sheet, key, extra = "") {
  const S = W.sheets[sheet];
  const i = S && S.map[key];
  const ar = S ? `${S.w} / ${S.h}` : "1";
  if (i == null) return `<div class="pic empty" style="aspect-ratio:${ar}">NO RENDER</div>`;
  const c = i % S.cols, r = Math.floor(i / S.cols);
  const file = S.file;
  return `<div class="pic" ${extra} style="aspect-ratio:${ar};background-image:url(img/${file}.webp);background-size:${S.cols * 100}% ${S.rows * 100}%;background-position:${S.cols > 1 ? c / (S.cols - 1) * 100 : 0}% ${S.rows > 1 ? r / (S.rows - 1) * 100 : 0}%"></div>`;
}

// a boss with no studio render shows its signature move in the game

// a mock of the plate over an elite or a boss: name line, health bar, optional shield bar, a body outlined in its colour

}

// ------------------------------------------------------------- the field
// each field card: short rows (WHEN / HOLD / FIGHT / GETS / RISK) with colour doing the reading (the owner, 2026-10-28: "Keep the
// text more simple and use color"). Markup in a row: [y:..] number (yellow), [g:..] reward (green), [r:..] risk (red), [c:..] the
// card's own colour (what you do).
const FIELD_ROWS = (id, F, N) => {
  const H = F.hoarder || {};
  return ({
    pod: [["WHEN", `[y:${pct(F.pod.chance)}] after a won wave`], ["HOLD", `[c:RESCUE] [y:${F.pod.hold} s]`],
      ["GETS", `[g:+1 CREW] (+${pct(F.pod.crewGen)} generators, max ${F.pod.crewMax}), then a [g:${F.pod.boostWaves}-wave BOOST]`], ["RISK", `[r:Gone] after ${F.pod.life} waves`]],
    legend: [["WHEN", `[y:${F.starfall.legendAt} s] into a STARFALL`], ["HOLD", `[c:OPEN]`], ["GETS", `[g:LEGENDARY GUN], [y:${pct(F.starfall.evolve)}] an [g:EVOLVE] one`]],
    crate: [["WHEN", `[y:${F.starfall.crates}] per STARFALL`], ["HOLD", `[c:OPEN] [y:${F.starfall.hold} s]`], ["GETS", `[g:1 wave clear]`]],
    wreck: [["WHEN", `[y:${pct(F.wreck.chance)}] after a won wave`], ["HOLD", `[c:SALVAGE] [y:${F.wreck.hold} s]`],
      ["GETS", `[g:${F.wreck.loot} wave clear${F.wreck.loot === 1 ? "" : "s"}], gun [y:${pct(F.wreck.gunChance)}], Xeno Core [y:${pct(F.wreck.coreChance)}]`], ["RISK", `[r:Gone] when the wave starts`]],
    camp: [["WHEN", `[y:${pct(F.roam.chance)}] after a won wave, max [y:${F.roam.camps}]`], ["FIGHT", `[c:${F.roam.size[0]} to ${F.roam.size[1]} aliens]`], ["GETS", `[g:1 wave clear]`],
      ["RISK", `Left alive: [r:they join the boss wave] at [r:x${F.roam.joinHp}] health`]],
    nest: [["WHEN", `From wave [y:${N.from}], every [y:${N.every}] waves won, max [y:${N.max}]`], ["RISK", `Its lane: [r:+${pct(N.laneHp)} health +${pct(N.laneDmg)} damage] a level`],
      ["FIGHT", `[c:Guns only] (turrets do nothing)`], ["GETS", `[g:Loot + a gun], then [r:HIVE FURY]`]],
    hoarder: [["WHEN", `[y:${pct(H.chance || 0)}] after a won wave, from wave [y:${H.from}]`], ["FIGHT", `[c:Chase it, shoot it down]: it runs`],
      ["GETS", `[g:${(H.cores || [0, 0])[0]} to ${(H.cores || [0, 0])[1]} XENO CORES] (more later, max [y:${H.coreMax}])`]],
  })[id] || [];
};
const fieldRows = (id, F, N, col) => `<div class="frows">${FIELD_ROWS(id, F, N).map(([k, t]) => `<div><i>${k}</i><span>${esc(t).replace(/\[([ygrc]):([^\]]*)\]/g,

  <div class="list">${W.field.boosts.map(b => `<span class="tag" style="--c:#6eff78">${pix("pod", "#6eff78", 14)}${esc(b.text)}</span>`).join("")}</div>
  ${W.fieldShots.length ? `<div class="sec"><h2>IN THE GAME</h2></div><div class="shotgrid">${W.fieldShots.map(s => `<figure><img src="img/field/${s.id}.jpg" alt="${esc(s.name)}" loading="lazy"><figcaption>${esc(s.name)}</figcaption></figure>`).join("")}</div>` : ""}`;

// global search across everything
function searchPage(q) {
  const t = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = s => t.every(w => s.toLowerCase().includes(w));
  const g = guns.filter(x => hit([x.name, x.maker.name, x.maker.key, x.kind, x.rn, x.u ? "unique legendary " + x.ud + " " + x.ut : "", x.boss ? bossById[x.boss].name : "", x.e ? elName(x.e) : ""].join(" ")));
  const a = W.aliens.filter(x => hit([x.name, typeById[x.type].name, x.body, x.traits.join(" "), x.fly ? "flying" : "", x.mini ? "mini-boss" : ""].join(" ")));
  const b = W.bosses.filter(x => hit([x.name, x.title, x.tip, x.el ? elName(x.el) : "", x.body, x.moves ? x.moves.skills.join(" ") + " " + (x.moves.sig || "") : "", x.gunName || "", x.open ? "" : "coming soon locked"].join(" ")));
  const tu = W.turrets.filter(x => hit([x.name, TT[x.kind].name, TT[x.kind].role, TT[x.kind].desc, TT[x.kind].combo, x.label || "", x.price ? "robux" : ""].join(" ")));
  const m = brands.map((x, i) => ({ ...x, i })).filter(x => hit([x.name, x.key, x.desc].join(" ")));
  const ev = W.events.filter(x => hit([x.name, x.sub, x.tip, "event"].join(" ")));
  const fl = [...W.field.look.map(x => ({ name: x.name, color: x.color, icon: x.icon, page: "field" })), ...W.field.mutators.map(x => ({ name: x.name, color: x.color, icon: x.icon, page: "field", text: x.text + " mutator" }))]
    .filter(x => hit([x.name, x.text || "", "field"].join(" ")));
  const n = g.length + a.length + b.length + tu.length + m.length + ev.length + fl.length;
  const sec = (title, arr, html, cls = "") => arr.length ? `<div class="sec"><h2>${title}</h2><span class="sub">${arr.length}</span></div><div class="grid ${cls}">${html}</div>` : "";
  return `<div class="ph"><h1>SEARCH</h1><span class="sub">${n} results for "${esc(q)}"</span></div>
  ${sec("EVENTS", ev, ev.map(x => `<div class="box" style="--c:${x.color};cursor:pointer" tabindex="0" role="button" data-jump="events:x:x"><div class="ehead">${disc(x.pix, x.color, 34)}<div class="nm" style="color:${x.color}">${esc(x.name)}</div></div><div class="meta">${esc(x.sub)}</div></div>`).join(""), "wide")}
  ${sec("THE FIELD", fl, fl.map(x => `<div class="box" style="--c:${x.color};cursor:pointer" tabindex="0" role="button" data-jump="field:x:x"><div class="ehead">${disc(x.icon, x.color, 34)}<div class="nm" style="color:${x.color}">${esc(x.name)}</div></div></div>`).join(""))}
  ${sec("BOSSES", b, b.map(bossCard).join(""))}${sec("TURRETS", tu, tu.map(turretCard).join(""))}
  ${sec("MAKERS", m, m.map(x => `<div class="card" style="--c:${x.tint}" tabindex="0" role="button" data-jump="guns:maker:${x.i}"><div class="in"><div class="nm" style="color:${x.tint}">${esc(x.name)}</div><div class="efx">${esc(x.desc)}</div></div></div>`).join(""))}
  ${sec("GUNS", g, g.slice(0, 120).map(gunCard).join(""))}${g.length > 120 ? `<p class="hint">Showing 120 of ${g.length}. Narrow the search.</p>` : ""}
  ${sec("ALIENS", a, a.map(alienCard).join(""), "sm")}
  ${n ? "" : `<div class="empty-msg">Nothing found. Try a name, a maker, an element or a move.</div>`}`;
}

// ------------------------------------------------------------- detail sheets
function statRow(k, v, frac, txt) { return `<div class="st"><span class="k">${STAT_ICON[k] ? gi(STAT_ICON[k]) : ""}${k}</span><span class="b"><i style="width:${Math.max(2, Math.min(100, frac * 100))}%"></i></span><span class="v">${txt ?? v}</span></div>`; }
function maxOf(list, f) { return Math.max(...list.map(f).filter(x => isFinite(x)), 0.0001); }
const sheetHtml = {
  gun(id) {
    const g = gunById[id], s = g.st || {}, same = guns.filter(x => x.kind === g.kind && x.st);
    const fam = g.u ? [] : family(g), mk = g.maker;
    const accuracy = Math.max(0, 1 - (s.spread || 0) / 6);
    return { c: g.rc, html: `<div class="hd"><span class="score">${fmt(s.score)}</span><span class="lbl">ITEM SCORE</span><span class="r">${g.rn} ${g.kind.toUpperCase()}</span></div>
    <div class="bd"><div class="two"><div style="display:grid;gap:8px">
      <h3>${esc(g.name)}</h3>
      <div class="meta"><span class="maker" style="color:${mk.tint};font-size: 16px">${esc(mk.name)}</span>${g.e ? elTag(g.e) : '<span class="tag">ELEMENT ROLLED</span>'}</div>
      ${gunPic(g)}
      ${g.u ? `<div class="box" style="--c:#ffb400"><div class="flav">"${esc(g.ut)}"</div><div class="efx">${esc(g.ud)}</div></div>` : ""}
      ${g.boss ? `<div class="box" style="--c:${bossById[g.boss].color}"><h4>DROPS FROM</h4><div class="meta" style="cursor:pointer" data-sheet="boss:${g.boss}">${icon("skull")}<b style="color:var(--white)">${esc(bossById[g.boss].name)}</b> in THE DEEP, wave ${bossById[g.boss].wave} boss</div></div>` : ""}
    </div><div class="stats">
      <h4>AT LEVEL 1, PLAIN PARTS${g.e ? "" : ", KINETIC"}</h4>
      ${statRow("DAMAGE", 0, (s.dmg * s.pellets) / maxOf(same, x => x.st.dmg * x.st.pellets), fmt(s.dmg) + (s.pellets > 1 ? " x" + s.pellets : ""))}
      ${statRow("FIRE RATE", 0, s.rate / maxOf(same, x => x.st.rate), fmt(s.rate) + "/s")}
      ${statRow("MAGAZINE", 0, s.mag / maxOf(same, x => x.st.mag), s.mag)}
      ${statRow("RELOAD", 0, 1 - s.reload / (maxOf(same, x => x.st.reload) * 1.2), fmt(s.reload) + "s")}
      ${statRow("CRITICAL", 0, s.crit / maxOf(same, x => x.st.crit), pct(s.crit) + " x" + s.critMult)}
      ${statRow("ACCURACY", 0, accuracy, pct(accuracy))}
      ${statRow("RANGE", 0, s.range / maxOf(same, x => x.st.range), s.range)}
      ${s.burst > 1 ? statRow("BURST", 0, 1, s.burst + " rounds") : ""}${s.splash ? statRow("SPLASH", 0, 1, s.splash + " studs") : ""}${s.pierce ? statRow("PIERCE", 0, 1, "YES") : ""}
      <div class="box" style="--c:${mk.tint}"><h4>${esc(mk.name)}</h4><div class="efx">${esc(mk.desc)}</div></div>
    </div></div>
    ${!g.u && fam.length ? `<div><h4>THE ${esc(g.name)} FAMILY</h4><div class="ladder">${fam.map(x => `<div class="card" style="--c:${x.rc}${x.id === g.id ? ";filter:brightness(1.3)" : ""}" data-sheet="gun:${x.id}" tabindex="0" role="button"><div class="in">${sprite("gun", x.pic)}<div class="meta" style="justify-content:space-between"><span style="color:${x.rc};font-weight:700">${x.rn}</span><span>${fmt(x.st?.score)}</span></div></div></div>`).join("")}</div></div>` : ""}
    </div>` };
  },
  alien(id) {
    const a = alienById[id], t = typeById[a.type];
    const sib = W.aliens.filter(x => x.type === a.type);
    return { c: t.tint || "#9fd7fa", html: `<div class="hd"><span class="score">${a.n}</span><span class="lbl">OF 10</span><span class="r">${esc(t.name)}</span></div>
    <div class="bd"><div class="two"><div style="display:grid;gap:8px"><h3>${esc(a.name)}</h3>
      <div class="meta">${bodyTag(a.body)}${a.fly ? `<span class="tag">${icon("wing")}FLYING</span>` : ""}${a.mini ? `<span class="tag solid" style="--c:var(--orange)">MINI-BOSS</span>` : ""}<span class="tag" style="--c:var(--cyan)">FIRST WAVE ${a.wave ?? 1}</span></div>
      ${sprite("alien", a.id)}</div>
      <div class="stats"><h4>WAVE 1 STRENGTH</h4>
      ${statRow("HEALTH", 0, a.hp / maxOf(W.aliens.filter(x => !x.mini), x => x.hp), fmt(a.hp))}
      ${statRow("DAMAGE", 0, a.dmg / maxOf(W.aliens, x => x.dmg), fmt(a.dmg))}
      ${statRow("SPEED", 0, a.speed / maxOf(W.aliens, x => x.speed), fmt(a.speed))}
      ${statRow("XP", 0, (a.xp || 0) / maxOf(W.aliens, x => x.xp || 0), a.xp)}
      ${a.shield ? statRow("SHIELD", 0, 1, "x" + a.shield) : ""}
      <div class="box" style="--c:var(--green)"><h4>DROPS</h4><div>${cost(a.reward)}</div></div>
      ${a.traits.length ? `<div class="box"><h4>TRAITS</h4><div class="list">${a.traits.map(x => `<span class="tag" style="--c:var(--yellow)">${human(x)}</span>`).join("")}</div></div>` : ""}
      <div class="box" style="--c:var(--yellow)"><h4>HOW TO KILL</h4><div class="efx">${esc(t.counter)}</div></div></div></div>
      <div><h4>${esc(t.name)}</h4><div class="ladder">${sib.map(x => `<div class="card" style="--c:${x.id === a.id ? "var(--yellow)" : "var(--steel)"}" data-sheet="alien:${x.id}" tabindex="0" role="button"><div class="in">${sprite("alien", x.id)}<div class="meta" style="justify-content:space-between"><b style="color:var(--white)">${esc(x.name)}</b><span>W${x.wave ?? 1}</span></div></div></div>`).join("")}</div></div>
    </div>` };
  },
  boss(id) {
    const b = bossById[id], m = b.moves, gun = guns.find(g => g.u === b.gun);
    return { c: b.color || "#ff5a6e", html: `<div class="hd"><span class="score">${b.wave}</span><span class="lbl">WAVE</span><span class="r">FINAL BOSS</span></div>
    <div class="bd"><div class="two"><div style="display:grid;gap:8px"><h3>${esc(b.name)}</h3><div class="meta" style="font-size: 16px">${esc(b.title || "")}</div>
      <div class="meta">${b.el ? elTag(b.el) : elTag("none")}${bodyTag(b.body)}${b.fly ? `<span class="tag">${icon("wing")}FLIES</span>` : ""}</div>
      <div style="position:relative">${bossPic(b.id)}${b.open ? "" : `<div class="stamp"><span>${icon("lock")} COMING SOON</span></div>`}</div></div>
      <div class="stats"><h4>AT ITS WAVE</h4>
      ${statRow("HEALTH", 0, Math.log(b.hp) / Math.log(maxOf(W.bosses, x => x.hp)), fmt(b.hp))}
      ${statRow("DAMAGE", 0, b.dmg / maxOf(W.bosses, x => x.dmg), fmt(b.dmg))}
      ${statRow("SPEED", 0, b.speed / maxOf(W.bosses, x => x.speed), fmt(b.speed))}
      <div class="box" style="--c:var(--green)"><h4>REWARD</h4><div>${cost(b.reward)}</div></div>
      ${b.tip ? `<div class="box" style="--c:var(--yellow)"><h4>TIP</h4><div class="efx">${esc(b.tip)}</div></div>` : ""}
      ${gun ? `<div class="box" style="--c:#ffb400;cursor:pointer" data-sheet="gun:${gun.id}"><h4>ITS LEGENDARY</h4><b style="color:#ffb400">${esc(gun.name)}</b><div class="efx">${esc(gun.ud)}</div><div class="hint">${(W.arena.legend.base * 100).toFixed(1)}% at level 1, +${(W.arena.legend.perLevel * 100).toFixed(1)}% a level${b.deepOnly ? ". Only from THE DEEP." : ""}</div></div>` : ""}
      </div></div>
    ${m ? `<div class="two"><div class="box" style="--c:var(--red)"><h4>SKILLS</h4><div class="list">${m.skills.map(s => `<span class="tag" style="--c:#ff7a8a">${esc(s)}</span>`).join("")}</div><h4 style="margin-top:6px">NORMAL ATTACK</h4><div class="efx">${esc(m.normal)}</div></div>
      <div class="box" style="--c:var(--red)"><h4>SIGNATURE</h4><b style="color:var(--red);font-size: 20px">${esc(m.sig || "-")}</b>${b.sigText ? `<div class="efx">${esc(b.sigText)}</div>` : ""}</div></div>` : ""}
    ${b.shots.length ? `<div><h4>IN THE DEEP</h4><div class="shots">${b.shots.map(s => `<figure><img loading="lazy" src="img/boss/${s.id}.jpg" alt="${esc(b.name)}: ${esc(s.name)}"><figcaption>${esc(s.name)}</figcaption></figure>`).join("")}</div></div>` : ""}
    </div>` };
  },
  turret(id) {
    const t = turById[id], ty = TT[t.kind];
    const ladder = W.turrets.filter(x => x.n);
    const col = t.price ? "#ffb400" : ty.comboColor;
    return { c: col, html: `<div class="hd"><span class="score">${t.n || "R$"}</span><span class="lbl">${t.n ? "STEP OF 50" : t.price}</span><span class="r">${esc(ty.role)}</span></div>
    <div class="bd"><div class="two"><div style="display:grid;gap:8px"><h3>${esc(t.name)}</h3>
      <div class="meta"><span class="tag" style="--c:${ty.comboColor}">${esc(ty.name)}</span><span class="tag" style="--c:var(--cyan)">LOOK: MK ${t.level}</span>${t.label ? `<span class="tag" style="--c:#ffb400">${esc(t.label)}</span>` : ""}</div>
      ${sprite("turret", t.pic)}<div class="efx">${esc(ty.desc)}</div></div>
      <div class="stats"><h4>PLAYER LEVEL 1</h4>
      ${statRow("DAMAGE", 0, t.dmg / maxOf(W.turrets, x => x.dmg), fmt(t.dmg))}
      ${statRow("FIRE RATE", 0, t.rate / maxOf(W.turrets, x => x.rate), fmt(t.rate) + "/s")}
      ${statRow("DPS", 0, Math.log(turDps(t)) / Math.log(maxOf(W.turrets, turDps)), fmt(turDps(t)))}
      ${statRow("RANGE", 0, t.range / maxOf(W.turrets, x => x.range), t.range)}
      ${t.splash ? statRow("SPLASH", 0, t.splash / 21, fmt(t.splash) + " studs") : ""}${t.chain ? statRow("CHAIN", 0, t.chain / 6, t.chain + " aliens") : ""}${t.pierce ? statRow("PIERCE", 0, t.pierce / 3, t.pierce + " aliens") : ""}
      <div class="box" style="--c:var(--yellow)"><h4>${t.price ? "PRICE" : "UNLOCK AND PRICE"}</h4><div>${t.price ? `R$ ${t.price}, x${t.power} the top step's power` : `Best wave ${t.wave}+ &nbsp; ${cost(t.cost)}`}</div></div>
      <div class="box" style="--c:${ty.comboColor}"><h4 style="display:flex;gap:8px;align-items:center">${mchip(ty.comboId, ty.comboColor, 30)}COMBO MARK: ${esc(ty.combo)}</h4><div class="efx">Lasts ${ty.comboDur} s; another turret type or your gun cashes it in.</div></div>
      <div class="box" style="--c:var(--cyan)"><h4>ABILITIES</h4><div class="meta"><span class="tag" style="--c:${t.level >= 5 ? "var(--cyan)" : "#56708a"}">MK 5</span>${esc(ty.t5)}</div><div class="meta"><span class="tag" style="--c:${t.level >= 10 ? "var(--cyan)" : "#56708a"}">MK 10</span>${esc(ty.t10)}</div></div>
      </div></div>
      <div><h4>THE LADDER</h4><div class="tbl"><table><tr><th class="num">STEP</th><th>TURRET</th><th class="num">WAVE</th><th class="num">DPS</th><th class="num">RANGE</th><th>PRICE</th></tr>
      ${ladder.map(x => `<tr class="${x.id === t.id ? "hl" : ""}" data-sheet="turret:${x.id}" style="cursor:pointer"><td class="num">${x.n}</td><td><b>${esc(x.name)}</b></td><td class="num">${x.wave}</td><td class="num">${fmt(turDps(x))}</td><td class="num">${x.range}</td><td>${cost(x.cost)}</td></tr>`).join("")}</table></div></div>
    </div>` };
  },
};
let openKey = null;
function open(key, extra) {
  const [kind, id] = key.split(":");
  const r = sheetHtml[kind](id, extra);
  openKey = key;
  const ov = $("#ov");
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" style="--c:${r.c}"><button class="close" aria-label="Close">&#x2715;</button>${r.html}</div>`;
  ov.hidden = false;
  ov.scrollTop = 0;
  $(".close", ov).focus({ preventScroll: true });
}
function closeSheet() { $("#ov").hidden = true; openKey = null; }
$("#ov").addEventListener("click", e => {
  if (e.target.id === "ov" || e.target.closest(".close")) return closeSheet();
  const s = e.target.closest("[data-sheet]");
  if (s) open(s.dataset.sheet);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#ov").hidden) closeSheet(); if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });

// ------------------------------------------------------------- render
function render() {
  nav();
  $("#main").innerHTML = st.q ? searchPage(st.q) : P[st.page]();
}
let tmr;
$("#q").addEventListener("input", e => { $("#qx").hidden = !e.target.value; clearTimeout(tmr); tmr = setTimeout(() => { st.q = e.target.value.trim(); render(); }, 120); });
$("#qx").addEventListener("click", () => { $("#q").value = ""; $("#qx").hidden = true; st.q = ""; render(); $("#q").focus(); });
const h = location.hash.slice(1);
if (P[h]) st.page = h;
window.addEventListener("hashchange", () => { const p = location.hash.slice(1); if (P[p] && p !== st.page) { closeSheet(); go(p); } });
render();
})();
</script>
